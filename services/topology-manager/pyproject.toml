[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "g5-topology-manager"
version = "0.1.0"
description = "G5 Topology Manager: topologías predefinidas, borradores, importar/exportar y compilación a spec"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
