[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "g5-iam"
version = "0.2.0"
description = "G5 identity, sessions and academic authorization"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]
