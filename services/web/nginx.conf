server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Mismo origen: el navegador solo habla con nginx; nginx reenvía al gateway por la red interna.
    # Importar imágenes (D-15): cuerpo grande, en streaming (sin búfer en disco), hasta el gateway.
    location = /api/v1/images {
        proxy_pass http://gateway:8000/v1/images;
        proxy_set_header Host $host;
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header Cache-Control no-store always;
    }

    location /api/ {
        proxy_pass http://gateway:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
        add_header Cache-Control no-store always;
    }

    # Consola noVNC de las VMs Linux: websockify del platform-manager (token propio, de vida corta).
    # La página y su WebSocket (path=lconsole/websockify?token=...) pasan por aquí.
    location /lconsole/ {
        proxy_pass http://platform-manager:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
    }

    # Consola noVNC de Nova (vía os-tunnel). La página y su WebSocket (path=console/?token=...) pasan por aquí,
    # así basta el túnel a la web. El token de Nova es de un solo uso y vida corta.
    location /console/ {
        proxy_pass http://os-tunnel:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # nova-novncproxy compara el Origin con el Host: se conserva el host que ve el navegador.
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Sin la CSP global: noVNC usa un script de módulo embebido. Solo se ejecuta en esta ruta.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
