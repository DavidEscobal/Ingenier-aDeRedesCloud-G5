name: g5-app

services:
  iam:
    build:
      context: ../services/iam-service
    environment:
      IAM_DB_PATH: /app/state/iam/iam.db
      IAM_SECRET_FILE: /app/state/iam/jwt.key
      IAM_TOKEN_TTL_SECONDS: "900"
    volumes:
      - iam-data:/app/state/iam
    restart: unless-stopped
    networks: [control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  slice-manager:
    build:
      context: ../services/slice-manager
    environment:
      IAM_URL: http://iam:8000
    depends_on:
      iam:
        condition: service_healthy
    restart: unless-stopped
    networks: [control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  os-tunnel:
    # Túneles SSH hacia las APIs de OpenStack, visibles solo en la red `control`
    # (http://os-tunnel:5000, :8774, :9696, :9292, :6080). No toca g5-tunnels del host.
    profiles: [platform]
    build:
      context: ../services/os-tunnel
      args:
        APP_UID: ${G5_UID:-1000}
        APP_GID: ${G5_GID:-1000}
    environment:
      OS_TUNNEL_GATEWAY: ${OS_TUNNEL_GATEWAY:-ubuntu@10.20.11.245}
      OS_TUNNEL_CONTROLLER: ${OS_TUNNEL_CONTROLLER:-192.168.202.1}
      OS_TUNNEL_PORTS: "5000 8774 9696 9292 6080"
    volumes:
      # Clave del app server hacia el gateway (restringida con permitopen) y known_hosts.
      - ${G5_PLATFORM_CONFIG:-./platform-config}/tunnel-ssh:/home/tunnel/.ssh:ro
    restart: unless-stopped
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "for p in 5000 8774 9696 9292 6080; do nc -z 127.0.0.1 $$p || exit 1; done"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  platform-manager:
    # Núcleo de ejecución (g5/): cola de jobs, Engine y drivers Linux/OpenStack.
    # Sin puertos publicados: solo lo alcanzan servicios de la red `control`.
    # Perfil propio: no arranca con `up` hasta preparar su configuración
    # (docker compose --profile platform up -d).
    profiles: [platform]
    build:
      context: ..
      dockerfile: services/platform-manager/Dockerfile
      args:
        APP_UID: ${G5_UID:-1000}
        APP_GID: ${G5_GID:-1000}
    volumes:
      - platform-data:/app/state
      # Configuración y secretos del host, solo lectura (nunca en la imagen ni en Git).
      - ${G5_PLATFORM_CONFIG:-./platform-config}/cluster.json:/run/g5/cluster.json:ro
      - ${G5_PLATFORM_CONFIG:-./platform-config}/keys.json:/run/g5/keys.json:ro
      - ${G5_PLATFORM_CONFIG:-./platform-config}/openstack.env:/run/g5/openstack.env:ro
      - ${G5_PLATFORM_CONFIG:-./platform-config}/ssh:/home/appuser/.ssh:ro
    depends_on:
      os-tunnel:
        condition: service_healthy
    restart: unless-stopped
    networks: [control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: ../services/gateway
    environment:
      IAM_URL: http://iam:8000
      SLICE_MANAGER_URL: http://slice-manager:8000
      UPSTREAM_TIMEOUT_SECONDS: "3"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      iam:
        condition: service_healthy
      slice-manager:
        condition: service_healthy
    restart: unless-stopped
    networks: [control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=8)"]
      interval: 10s
      timeout: 9s
      retries: 3
      start_period: 10s

networks:
  control:
    driver: bridge

volumes:
  iam-data:
  platform-data:
